name: Kanaf native rebuild
on:
  push:
    branches: [rebuild/kanaf-native-v1]
    paths: ['native-rebuild/**', '.github/workflows/kanaf-native-rebuild.yml']
  pull_request:
    paths: ['native-rebuild/**', '.github/workflows/kanaf-native-rebuild.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: native-rebuild
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Use preinstalled Android SDK
        run: |
          test -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" || test -x "$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager"
          echo "ANDROID_HOME=$ANDROID_HOME"
      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Print toolchain versions
        run: |
          java -version
          gradle --version
          echo "ANDROID_HOME=$ANDROID_HOME"
      - name: Run native unit tests
        run: gradle --no-daemon :app:testDebugUnitTest --stacktrace
      - name: Android lint
        run: gradle --no-daemon :app:lintDebug --stacktrace
      - name: Build native debug APK
        run: gradle --no-daemon :app:assembleDebug --stacktrace
      - name: Upload diagnostic reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kanaf-native-diagnostics
          path: |
            native-rebuild/app/build/reports/
            native-rebuild/app/build/test-results/
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: kanaf-native-debug
          path: native-rebuild/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
