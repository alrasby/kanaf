name: Kanaf native rebuild
on:
  push:
    branches: [rebuild/kanaf-native-v1]
    paths: ['native-rebuild/**', '.github/workflows/kanaf-native-rebuild.yml']
  pull_request:
    paths: ['native-rebuild/**', '.github/workflows/kanaf-native-rebuild.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: native-rebuild
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Run native unit tests
        run: gradle --no-daemon :app:testDebugUnitTest --stacktrace
      - name: Android lint
        run: gradle --no-daemon :app:lintDebug --stacktrace
      - name: Build native debug APK
        run: gradle --no-daemon :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: kanaf-native-debug
          path: native-rebuild/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
