name: Kanaf native rebuild
on:
  push:
    branches: [rebuild/kanaf-native-v1]
    paths: ['native-rebuild/**', '.github/workflows/kanaf-native-rebuild.yml']
  pull_request:
    paths: ['native-rebuild/**', '.github/workflows/kanaf-native-rebuild.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: native-rebuild
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Locate Android SDK manager
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER=""
          for candidate in "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager"; do
            if [[ -x "$candidate" ]]; then SDKMANAGER="$candidate"; break; fi
          done
          if [[ -z "$SDKMANAGER" ]]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit 2>/dev/null || true)"
          fi
          if [[ -z "$SDKMANAGER" || ! -x "$SDKMANAGER" ]]; then
            echo "::error::Android sdkmanager is not installed under ANDROID_HOME"
            exit 1
          fi
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          "$SDKMANAGER" --version
      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Print toolchain versions
        run: |
          java -version
          gradle --version
          echo "ANDROID_HOME=$ANDROID_HOME"
      - name: Run native unit tests
        run: gradle --no-daemon :app:testDebugUnitTest --stacktrace
      - name: Android lint
        run: gradle --no-daemon :app:lintDebug --stacktrace
      - name: Build native debug APK
        run: gradle --no-daemon :app:assembleDebug --stacktrace
      - name: Upload diagnostic reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kanaf-native-diagnostics
          path: |
            native-rebuild/app/build/reports/
            native-rebuild/app/build/test-results/
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: kanaf-native-debug
          path: native-rebuild/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  arm64-engines:
    uses: ./.github/workflows/kanaf-native-engines-probe.yml
    permissions:
      contents: read
