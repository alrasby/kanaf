name: Kanaf repeat benign APK performance benchmark
on:
  push:
    branches: [evaluation/full-clamav-android]
    paths:
      - 'evaluation/android_baseline/**'
      - 'native-rebuild/app/src/androidTest/java/com/kanaf/alrasby/IndependentCorpusAndroidTest.kt'
      - '.github/workflows/kanaf-independent-benchmark.yml'
  workflow_dispatch:
concurrency:
  group: kanaf-full-clamav-android-benchmark
  cancel-in-progress: true
permissions:
  contents: read
  actions: read
jobs:
  arm64-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Download pinned, verified ARM64 native engines
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          CLAM_RUN=43745138794
          YARA_RUN=43745138817
          # The ClamAV compilation job may finish before its independent
          # APK smoke-test job. Only the successful compiler artifact is used.
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CLAM_RUN/jobs" --jq '.jobs[] | select(.name == "clamav") | .conclusion')" = success
          test "$(gh run view "$YARA_RUN" --repo "$GITHUB_REPOSITORY" --json conclusion --jq .conclusion)" = success
          dest=native-rebuild/app/src/main/jniLibs/arm64-v8a
          mkdir -p "$dest" /tmp/kanaf-clam /tmp/kanaf-yara
          gh run download "$CLAM_RUN" --repo "$GITHUB_REPOSITORY" -n kanaf-clamav-arm64-diagnostics -D /tmp/kanaf-clam
          test "$(tr -d '\n' < /tmp/kanaf-clam/revision.txt)" = "5853e1396777bae4d909cd3dd44f58352e7cf9b3"
          gh run download "$YARA_RUN" --repo "$GITHUB_REPOSITORY" -n kanaf-yarax-arm64-diagnostics -D /tmp/kanaf-yara
          cp /tmp/kanaf-clam/arm64-output/libclamav.so "$dest/"
          cp /tmp/kanaf-clam/arm64-output/libclammspack.so "$dest/"
          cp /tmp/kanaf-yara/libyara_x_capi.so "$dest/"
          for so in "$dest"/*.so; do
            python3 native-rebuild/tools/verify_arm64_elf.py --require-16kb "$so"
          done
      - name: Install Android build components
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"
      - name: Freeze the same benign APKs and candidate code
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          git fetch origin 9a8b9a8ae45b0ba851927d0e35647c6e31a2159d --depth=1
          git diff --exit-code 9a8b9a8ae45b0ba851927d0e35647c6e31a2159d -- native-rebuild/app/src/main native-rebuild/app/build.gradle.kts
          python3 - <<'PYTHON'
          import json, os
          from pathlib import Path
          manifest = json.loads(Path("evaluation/android_baseline/corpus-manifest.json").read_bytes())
          rows = [r for r in manifest["samples"] if r["label"] == "benign" and r["zip_has_android_manifest"]]
          assert len(rows) == 60 and len({r["sha256"] for r in rows}) == 60
          manifest["samples"] = rows[int(os.environ["SHARD"])::6]
          Path(os.environ["RUNNER_TEMP"], "kanaf-benchmark-shard.json").write_text(json.dumps(manifest))
          PYTHON
          python3 evaluation/android_baseline/download_frozen.py "$RUNNER_TEMP/kanaf-benchmark-shard.json" /tmp/kanaf-evaluation-samples
      - name: Extract the same official CVDs used by the baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download 44503630071 --repo alrasby/kanaf -n kanaf-full-clamav-arm64-test -D "$RUNNER_TEMP/benchmark-cvd-apk"
          cd "$RUNNER_TEMP/benchmark-cvd-apk"
          sha256sum -c SHA256SUMS.txt
          target="$RUNNER_TEMP/clamav-assets/official-clamav"
          mkdir -p "$target"
          for name in main daily bytecode; do
            unzip -p Kanaf-Full-ClamAV-238bad7-arm64.apk "assets/official-clamav/$name.cvd" > "$target/$name.cvd"
          done
          cd "$target"
          sha256sum -c <<'HASHES'
          0b2182d229f46981ec8f535382222f7c9dfdd656b250ad47988b910a8d302365  main.cvd
          ddc126f2b7834d1dfe5a16fc9b2851740778de5a4fc7e388dcc16d41ede09866  daily.cvd
          6d4aa01f219e988060fc419f495d07f27e0cdf1a2cccc065971da922c76f7ffb  bytecode.cvd
          HASHES
      - name: Compile the benchmark APKs before booting the emulator
        run: bash evaluation/android_baseline/run_android.sh build
      - name: Enable KVM access
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test actual ARM64 JNI on Android 35 translated emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 6144M
          heap-size: 384M
          emulator-boot-timeout: 900
          disable-animations: true
          working-directory: .
          script: bash evaluation/android_baseline/run_android.sh
      - name: Upload runtime instrumentation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kanaf-benign-apk-shard-${{ matrix.shard }}
          path: |
            /tmp/kanaf-evaluation-reports/
          if-no-files-found: warn
