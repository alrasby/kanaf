name: Kanaf Android 15 — actual 16 KiB page-size emulator
on:
  push:
    branches: [rebuild/kanaf-native-v1]
    paths:
      - '.github/workflows/kanaf-16kb-emulator.yml'
      - 'native-rebuild/tools/run_16kb_emulator_ci.sh'
      - 'native-rebuild/app/src/androidTest/java/com/kanaf/alrasby/RealApkPipelineAndroidTest.kt'
      - 'native-rebuild/app/src/main/cpp/CMakeLists.txt'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: kanaf-android-16k-actual-pages
  cancel-in-progress: true
jobs:
  test-actual-16k-pages:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Enable hardware acceleration
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify genuine 16 KiB kernel page size and exercise app
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis_ps16k
          arch: x86_64
          profile: pixel_6
          ram-size: 3072M
          heap-size: 384M
          emulator-boot-timeout: 900
          disable-animations: true
          working-directory: native-rebuild
          script: bash tools/run_16kb_emulator_ci.sh
      - name: Save instrumented device evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kanaf-real-16kb-page-runtime-tests
          path: |
            native-rebuild/app/build/reports/androidTests/
            native-rebuild/app/build/outputs/androidTest-results/
          if-no-files-found: warn
