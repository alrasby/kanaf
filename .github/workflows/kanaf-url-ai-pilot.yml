name: Kanaf AI URL pilot — real dataset and Android smoke test
on:
  push:
    branches: [rebuild/kanaf-native-v1]
    paths:
      - '.github/workflows/kanaf-url-ai-pilot.yml'
      - 'native-rebuild/tools/train_url_risk_model.py'
      - 'native-rebuild/tools/test_train_url_risk_model.py'
      - 'native-rebuild/tools/run_url_ai_android_ci.sh'
      - 'native-rebuild/app/src/main/java/com/kanaf/alrasby/engine/KanafUrlAi.kt'
      - 'native-rebuild/app/src/main/java/com/kanaf/alrasby/MainActivity.kt'
      - 'native-rebuild/app/src/main/java/com/kanaf/alrasby/KanafGlassHome.kt'
      - 'native-rebuild/app/src/androidTest/java/com/kanaf/alrasby/KanafUrlAiAndroidTest.kt'
      - 'native-rebuild/app/build.gradle.kts'
  workflow_dispatch:
concurrency:
  group: kanaf-url-ai-pilot
  cancel-in-progress: true
permissions:
  contents: read
  actions: read
jobs:
  train-and-android-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Offline lexical feature contract tests
        run: python3 -m unittest discover -s native-rebuild/tools -p 'test_train_url_risk_model.py' -v
      - name: Install pinned scientific Python packages
        run: python3 -m pip install --disable-pip-version-check numpy==2.1.3 scikit-learn==1.6.1
      - name: Train against original licensed PhiUSIIL URLs; sign temporary pilot model
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out /tmp/kanaf-url-pilot.key
          openssl pkey -in /tmp/kanaf-url-pilot.key -pubout -outform DER |
            base64 -w0 > /tmp/kanaf-url-public.b64
          python3 native-rebuild/tools/train_url_risk_model.py \
            --private-key /tmp/kanaf-url-pilot.key \
            --output-dir /tmp/kanaf-url-ai
          install -m 0644 /tmp/kanaf-url-ai/url_risk_model.txt native-rebuild/app/src/main/assets/url_risk_model.txt
          install -m 0644 /tmp/kanaf-url-ai/url_risk_model.sig native-rebuild/app/src/main/assets/url_risk_model.sig
          echo "KANAF_URL_KEY=$(cat /tmp/kanaf-url-public.b64)" >> "$GITHUB_ENV"
          rm -f /tmp/kanaf-url-pilot.key
      - name: Preserve actual training evidence independently of emulator
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kanaf-url-ai-real-data-training-evidence
          path: |
            /tmp/kanaf-url-ai/evaluation.json
            /tmp/kanaf-url-ai/PUBLIC_DATA_ATTRIBUTION.txt
            /tmp/kanaf-url-ai/url_risk_model.txt
            /tmp/kanaf-url-ai/url_risk_model.sig
          if-no-files-found: warn
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install Android SDK for API36 and CMake
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"
      - name: Include previously verified 16 KiB ARM64 antivirus engines
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          CLAM_RUN=43745138794
          YARA_RUN=43745138817
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CLAM_RUN/jobs" --jq '.jobs[] | select(.name == "clamav") | .conclusion')" = success
          test "$(gh run view "$YARA_RUN" --repo "$GITHUB_REPOSITORY" --json conclusion --jq .conclusion)" = success
          mkdir -p /tmp/kanaf-clam-ai /tmp/kanaf-yara-ai
          gh run download "$CLAM_RUN" --repo "$GITHUB_REPOSITORY" -n kanaf-clamav-arm64-diagnostics -D /tmp/kanaf-clam-ai
          gh run download "$YARA_RUN" --repo "$GITHUB_REPOSITORY" -n kanaf-yarax-arm64-diagnostics -D /tmp/kanaf-yara-ai
          test "$(tr -d '\\n' < /tmp/kanaf-clam-ai/revision.txt)" = "5853e1396777bae4d909cd3dd44f58352e7cf9b3"
          dest=native-rebuild/app/src/main/jniLibs/arm64-v8a
          mkdir -p "$dest"
          cp /tmp/kanaf-clam-ai/arm64-output/libclamav.so "$dest/"
          cp /tmp/kanaf-clam-ai/arm64-output/libclammspack.so "$dest/"
          cp /tmp/kanaf-yara-ai/libyara_x_capi.so "$dest/"
          for so in "$dest"/*.so; do
            python3 native-rebuild/tools/verify_arm64_elf.py --require-16kb "$so"
          done
      - name: Verify signed model and assemble experimental debug APK
        working-directory: native-rebuild
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug \
            -PkanafUrlModelPublicKeyBase64="$KANAF_URL_KEY" --stacktrace
      - name: Verify combined experimental APK contains both AI and native scanners
        shell: bash
        run: |
          set -euo pipefail
          apk=native-rebuild/app/build/outputs/apk/debug/app-debug.apk
          test -s "$apk"
          for entry in assets/url_risk_model.txt assets/url_risk_model.sig lib/arm64-v8a/libclamav.so lib/arm64-v8a/libclammspack.so lib/arm64-v8a/libyara_x_capi.so lib/arm64-v8a/libkanaf_scan.so; do
            unzip -Z1 "$apk" | grep -Fx "$entry"
          done
          mkdir -p /tmp/kanaf-ai-native-check
          unzip -q "$apk" 'lib/arm64-v8a/*.so' -d /tmp/kanaf-ai-native-check
          for so in /tmp/kanaf-ai-native-check/lib/arm64-v8a/*.so; do
            python3 native-rebuild/tools/verify_arm64_elf.py --require-16kb "$so"
          done
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 -v 4 "$apk"
      - name: Enable KVM for reliable emulator acceleration
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Exercise signed model on Android 35 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 2048M
          heap-size: 256M
          emulator-boot-timeout: 900
          disable-animations: true
          working-directory: native-rebuild
          script: bash tools/run_url_ai_android_ci.sh
      - name: Publish experimental APK and aggregated provenance (no private keys/raw URLs)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kanaf-ai-combined-native-and-url-preview
          path: |
            native-rebuild/app/build/outputs/apk/debug/app-debug.apk
            /tmp/kanaf-url-ai/evaluation.json
            /tmp/kanaf-url-ai/PUBLIC_DATA_ATTRIBUTION.txt
            /tmp/kanaf-url-ai/url_risk_model.txt
            /tmp/kanaf-url-ai/url_risk_model.sig
            native-rebuild/app/build/reports/androidTests/
            native-rebuild/app/build/outputs/androidTest-results/
          if-no-files-found: warn
