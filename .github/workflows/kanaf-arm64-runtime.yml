name: Kanaf ARM64 native runtime probe
# Experimental: only this workflow/test file triggers the expensive emulator.
on:
  push:
    branches: [rebuild/kanaf-native-v1]
    paths:
      - '.github/workflows/kanaf-arm64-runtime.yml'
      - 'native-rebuild/app/src/androidTest/java/com/kanaf/alrasby/NativeArm64EngineRuntimeTest.kt'
      - 'native-rebuild/tools/run_arm64_runtime_ci.sh'
      - 'native-rebuild/app/src/main/java/com/kanaf/alrasby/engine/NativeScannerBridge.kt'
      - 'native-rebuild/app/src/main/cpp/native_scanner.cpp'
      - 'native-rebuild/app/src/main/cpp/clam_scan_policy.h'
      - 'native-rebuild/app/src/main/assets/kanaf_test.ndb'
  workflow_dispatch:
concurrency:
  group: kanaf-arm64-runtime-probe
  cancel-in-progress: true
permissions:
  contents: read
  actions: read
jobs:
  arm64-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Download pinned, verified ARM64 native engines
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          CLAM_RUN=43582067199
          YARA_RUN=43576728366
          for run in "$CLAM_RUN" "$YARA_RUN"; do
            test "$(gh run view "$run" --repo "$GITHUB_REPOSITORY" --json conclusion --jq .conclusion)" = success
          done
          dest=native-rebuild/app/src/main/jniLibs/arm64-v8a
          mkdir -p "$dest" /tmp/kanaf-clam /tmp/kanaf-yara
          gh run download "$CLAM_RUN" --repo "$GITHUB_REPOSITORY" -n kanaf-clamav-arm64-diagnostics -D /tmp/kanaf-clam
          gh run download "$YARA_RUN" --repo "$GITHUB_REPOSITORY" -n kanaf-yarax-arm64-diagnostics -D /tmp/kanaf-yara
          cp /tmp/kanaf-clam/arm64-output/libclamav.so "$dest/"
          cp /tmp/kanaf-clam/arm64-output/libclammspack.so "$dest/"
          cp /tmp/kanaf-yara/libyara_x_capi.so "$dest/"
          for so in "$dest"/*.so; do
            python3 native-rebuild/tools/verify_arm64_elf.py "$so"
          done
      - name: Enable KVM access
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test actual ARM64 JNI on Android 35 translated emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 3072M
          heap-size: 384M
          emulator-boot-timeout: 900
          disable-animations: true
          working-directory: native-rebuild
          script: bash tools/run_arm64_runtime_ci.sh
      - name: Upload runtime instrumentation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kanaf-arm64-native-runtime-evidence
          path: |
            native-rebuild/app/build/reports/androidTests/
            native-rebuild/app/build/outputs/androidTest-results/
          if-no-files-found: warn
