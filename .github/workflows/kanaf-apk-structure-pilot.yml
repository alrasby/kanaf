name: Kanaf APK structural AI — reproducible experimental fixture training
on:
  push:
    branches: [rebuild/kanaf-native-v1]
    paths:
      - '.github/workflows/kanaf-apk-structure-pilot.yml'
      - 'native-rebuild/tools/train_apk_structure_pilot.py'
      - 'native-rebuild/app/src/main/java/com/kanaf/alrasby/engine/ExperimentalApkStructureModel.kt'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reproduce-fixture-weights:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned trainer dependencies
        run: python -m pip install --disable-pip-version-check numpy==2.1.3 scikit-learn==1.6.1
      - name: Refit and verify the exact fixed on-device coefficients
        run: python native-rebuild/tools/train_apk_structure_pilot.py --output /tmp/kanaf-apk-structure-fixture-evidence.json
      - name: Publish honest synthetic-only evidence (no APKs)
        uses: actions/upload-artifact@v4
        with:
          name: kanaf-apk-structure-synthetic-proof
          path: /tmp/kanaf-apk-structure-fixture-evidence.json
          if-no-files-found: error
